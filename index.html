<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>농도와 반응 속도</title>
<style>
:root{--board:#3B5249;--paper:#FFFCF4;--line:#2A2A27;--title:#2F4A3E;--ink:#1E1E1C;--muted:#66635B}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--board);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:640px;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:32px 28px}
h1{font-size:26px;color:var(--title);margin-bottom:6px}
p{color:var(--muted);font-size:15px;margin-bottom:24px}
a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
a:hover{background:#F2EFE6}
a b{display:block;font-size:20px;margin-bottom:4px}
a span{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>농도와 반응 속도</h1>
  <p>4단원 2-01 · 아이오딘 시계 반응</p>
  <a href="app.html"><b>분석 프로그램</b><span>실험 결과 입력, 그래프와 예측, 목표 시간 맞추기</span></a>
  <a href="slides.html"><b>수업 슬라이드</b><span>화면을 누르면 다음 장으로 넘어갑니다</span></a>
</main>
</body>
</html>
